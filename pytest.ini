[pytest]
# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行选项（Windows路径用反斜杠或正斜杠都可）
addopts =
    -v
    --maxfail=1
    --tb=short
    --html=reports/report.html
    --self-contained-html

# 标记
markers =
    api: API接口测试
    ui: UI界面测试
    smoke: 冒烟测试
    regression: 回归测试
    p0: P0级别用例
    p1: P1级别用例